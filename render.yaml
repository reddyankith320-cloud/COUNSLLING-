# Render Blueprint — creates the API web service and its PostgreSQL database.
# In the Render dashboard: New → Blueprint → select this repo → Apply.
# Values marked `sync: false` are prompted for during setup (secrets).
services:
  - type: web
    name: findmypeace-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: findmypeace-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      # Your public site URL(s), comma-separated — e.g. https://findmypeace.vercel.app
      - key: FRONTEND_URL
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Must match the "Authorized redirect URI" in Google Cloud Console:
      # https://<this-service>.onrender.com/api/auth/google/callback
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: GOOGLE_CALENDAR_ID
        value: primary
      # Paste the value shown after connecting Google Calendar from the admin panel
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: Find My Peace <noreply@findmypeace.in>
      - key: COUNSELOR_NOTIFY_EMAIL
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: TWILIO_WHATSAPP_NUMBER
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: findmypeace-db
    plan: free
    databaseName: findmypeace
